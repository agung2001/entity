name: Release

# Pushing a version tag (v0.0.1, v1.2.0, …) builds the desktop installers,
# publishes them to a GitHub Release, and pushes a matching container image to
# GHCR. No long-lived certificate or signing secret is required: the macOS and
# Windows builds are unsigned.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    name: macOS (universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Align package version with the tag
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Build renderer
        run: npm run build

      - name: Package macOS DMG
        run: npx electron-builder --mac --universal --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The updater reads `latest-mac.yml` (the feed) and the `.blockmap` next
      # to it; a DMG-only artifact set leaves electron-updater with nothing to
      # find. The ZIP is the one Squirrel.Mac installs from.
      - uses: actions/upload-artifact@v4
        with:
          name: entity-macos
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml
          if-no-files-found: error

  windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Align package version with the tag
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Build renderer
        run: npm run build

      - name: Package Windows installer
        run: npx electron-builder --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: entity-windows
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error

  container:
    name: Container image (amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Entity
            org.opencontainers.image.description=Local-first hub for AI assistant entities
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  publish:
    name: Publish release
    needs:
      - macos
      - windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: entity-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Entity ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/*.dmg
            release-assets/*.zip
            release-assets/*.exe
            release-assets/*.blockmap
            release-assets/latest.yml
            release-assets/latest-mac.yml

      # The release is already public at this point, so a Discord outage must
      # never turn a good build red: `continue-on-error` plus the script's own
      # skip-when-unset behaviour. The step is a notification, not the thing
      # being shipped. `scripts/broadcast-release.mjs` reads the notes back from
      # the release GitHub just generated, quotes them, and stays under
      # Discord's embed limits — see `tests/unit/discord-broadcast.test.cjs`.
      # Add `DISCORD_WEBHOOK_URL` as a repo secret to turn it on; a fork without
      # the secret simply logs and skips.
      - name: Broadcast to Discord
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # Every release pings the channel. Clear it to `''` for a quiet card.
          DISCORD_MENTION: '@everyone'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/broadcast-release.mjs --tag "${{ github.ref_name }}"
