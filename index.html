<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Works in both modes: `ws:`/`http://localhost:*` are needed only by the
         Vite dev client (HMR socket); the packaged app just ignores them. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: http:; frame-src 'self' data:; object-src 'self' data:; font-src 'self' data:; connect-src 'self' ws://localhost:* http://localhost:*"
    />
    <title>entity — local agent workspace</title>
    <meta
      name="description"
      content="entity is a local workspace for AI agents: entities, skills, machines, chats, transcripts and artifacts — all on this machine."
    />
    <meta name="application-name" content="entity" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f8b956" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./site.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="entity" />
    <meta property="og:title" content="entity — local agent workspace" />
    <meta
      property="og:description"
      content="A local workspace for AI agents: entities, skills, machines, chats, transcripts and artifacts."
    />
    <meta property="og:image" content="./favicon.svg" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="entity — local agent workspace" />
    <meta
      name="twitter:description"
      content="A local workspace for AI agents: entities, skills, machines, chats, transcripts and artifacts."
    />
    <meta name="twitter:image" content="./favicon.svg" />
  </head>
  <body>
    <div id="app"></div>
    <script src="./theme-init.js"></script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
